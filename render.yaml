services:
  - type: web
    name: scoutly-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: BROWSER_MODE
        value: playwright
      - key: MOCK_MODE
        value: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: scoutly-frontend
    env: static
    buildCommand: npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: scoutly-backend
          property: host
